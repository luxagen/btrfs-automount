[package]
name = "btram"
version = "1.0.0"
edition = "2021"
description = "BTRFS auto-mounter companion tool to btrbk"
authors = ["Luxagen <btram@luxagen.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/luxagen/btram"

# The binary will use src/main.rs by default
# No need for explicit [[bin]] section for the default binary

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
regex = "1.11"
glob = "0.3"

[dev-dependencies]
tempfile = "3.19"
